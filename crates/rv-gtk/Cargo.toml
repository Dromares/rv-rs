[package]
name = "rv-gtk"
description = "GTK4 front end: DAT tree, game and ROM lists, update, scan, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rv-core = { workspace = true }
rv-cache = { workspace = true }
rv-dat = { workspace = true }
rv-scan = { workspace = true }
gtk4 = { version = "0.11.5", features = ["v4_10"] }
relm4 = "0.11.0"

[lib]
name = "rv_gtk"
path = "src/lib.rs"

[[bin]]
name = "rv-gtk"
path = "src/main.rs"
