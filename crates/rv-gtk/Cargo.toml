[package]
name = "rv-gtk"
description = "GTK4 front end: DAT tree, game and ROM lists, update, scan, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rv-core = { workspace = true }
rv-cache = { workspace = true }
rv-dat = { workspace = true }
rv-scan = { workspace = true }
rv-fix = { workspace = true }
rv-online = { workspace = true }
rv-update = { workspace = true }
gtk4 = { version = "0.11.5", features = ["v4_12"] }
relm4 = "0.11.0"

[dev-dependencies]
rv-online = { workspace = true, features = ["mock"] }
rv-update = { workspace = true, features = ["mock"] }
rv-archive = { workspace = true }

[lib]
name = "rv_gtk"
path = "src/lib.rs"

[[bin]]
name = "rv-gtk"
path = "src/main.rs"

# Needs a display, so it is its own program: it runs when RV_GTK_SMOKE=1 (CI sets it, under
# xvfb-run) and says so and passes otherwise. GTK must also be used from the main thread, which
# the default test harness does not give a test.
[[test]]
name = "smoke"
path = "tests/smoke.rs"
harness = false
