[package]
name = "rv-online"
description = "ROMVault's online services: the SOAP client, DatVault, MIA"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A mock of the services on 127.0.0.1 for the tests of this crate and of rv-cli. Nothing in a
# release build needs it.
mock = []

[dependencies]
rv-core = { workspace = true }
rv-archive = { workspace = true }
quick-xml = "0.37"
ruzstd = "0.9"
sha1 = "0.11"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
# ureq needs a crypto provider; ring is the one with a permissive licence (Apache-2.0 AND ISC).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rv-cache = { workspace = true }
