name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 development files
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 development files and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test --workspace
      # The window itself, headless: rv-gtk starts on a synthetic collection under a virtual X
      # display and reports what it shows (without RV_GTK_SMOKE=1 the test is skipped above).
      - name: GUI smoke test
        run: RV_GTK_SMOKE=1 GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a cargo test -p rv-gtk --test smoke
